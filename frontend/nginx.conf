server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Para todas las rutas, servimos index.html
    # React Router maneja el enrutamiento en el browser
    # Sin esta regla, /dashboard daría 404 al acceder directamente
    location / {
        try_files $uri $uri/ /index.html;
    }
}