version: '3.9'

services:
  # ── Base de datos PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medicall_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medicall_db
    ports:
      - '5432:5432'
    volumes:
      # Este volumen guarda los datos aunque el contenedor se detenga o elimine
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend Node.js ────────────────────────────────────────────────────────
  back:
    build: ./back
    container_name: medicall_backend
    environment:
      # Nota: el host es "postgres" (nombre del servicio de arriba, no localhost)
      # Dentro de la red de Docker, los contenedores se comunican por nombre de servicio
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/medicall_db
      JWT_SECRET: cambia_esto_por_una_clave_muy_larga_y_aleatoria
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: http://localhost
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy # Espera a que Postgres esté realmente listo
    restart: unless-stopped

  # ── Frontend React ─────────────────────────────────────────────────────────
  front:
    build:
      context: ./front
      args:
        VITE_API_URL: http://localhost:3001/api
    container_name: medicall_frontend
    ports:
      - '80:80'
    depends_on:
      - back
    restart: unless-stopped

volumes:
  postgres_data:
